# CHGOURI CAR Nginx Reverse Proxy Configuration
# Target: Ubuntu VPS / PM2
# File Location: /etc/nginx/sites-available/chgouricar.com

server {
    listen 80;
    listen [::]:80;
    server_name chgouricar.com www.chgouricar.com;

    # Enforce HTTPS redirect for security
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chgouricar.com www.chgouricar.com;

    # SSL Certificates (Managed by Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/chgouricar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chgouricar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip Compression for High-Speed Load Times
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 1000;

    # Root Directory for compiled React SPA frontend
    root /var/www/chgouricar/frontend/dist;
    index index.html;

    # Handle React Client SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Node.js / Express backend server running on PM2
    location /api {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        
        # Security Header Settings passed to backend controllers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Max payload uploads (PDFKit stream)
        client_max_body_size 10M;

        # Disable cache on API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Custom static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
